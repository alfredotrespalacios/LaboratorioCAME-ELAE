[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laboratorio-came"
version = "1.3.1"
description = "Plataforma académica ELAE para análisis de mercados eléctricos"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.40,<2",
  "pandas>=2.2,<3.1",
  "numpy>=2.0,<3",
  "plotly>=5.24,<7",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "statsmodels>=0.14.4,<0.15",
  "arch>=7.2,<9",
  "requests>=2.32,<3",
  "websocket-client>=1.8,<2",
  "pydataxm==0.3.18",
  "openpyxl>=3.1,<4",
  "xlsxwriter>=3.2,<4",
  "reportlab>=4.2,<5",
  "kaleido>=1.0,<2",
  "pydantic>=2.9,<3",
  "pyarrow>=18,<23",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: tests that contact an external official source",
  "live: tests that contact a live official source",
  "slow: tests that intentionally use a larger workload",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
